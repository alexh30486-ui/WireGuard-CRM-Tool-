# wg-quick config for the CONNECTOR side. Bring up with:
#   sudo wg-quick up ./wg-config/connector.conf
#
# Fill in PrivateKey (yours) and the Peer's PublicKey (the client's) --
# generate both with:
#   wg genkey | tee connector_private.key | wg pubkey > connector_public.key
#   wg genkey | tee client_private.key    | wg pubkey > client_public.key
#
# The Endpoint below points at the BRIDGE, not the real client -- the
# bridge is the only thing that ever talks to the network. WireGuard
# itself doesn't know or care that its "peer" is actually a local process
# forwarding to a relay.

[Interface]
PrivateKey = REPLACE_WITH_CONNECTOR_PRIVATE_KEY
Address = 100.64.0.1/32
ListenPort = 51820

[Peer]
PublicKey = REPLACE_WITH_CLIENT_PUBLIC_KEY
AllowedIPs = 100.64.0.2/32
Endpoint = 127.0.0.1:51821
PersistentKeepalive = 25
