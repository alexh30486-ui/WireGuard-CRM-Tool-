# wg-quick config for the CLIENT side. Bring up with:
#   sudo wg-quick up ./wg-config/client.conf
#
# Same idea as connector.conf, mirrored: this side's Endpoint points at
# ITS OWN local bridge port, not the connector's.

[Interface]
PrivateKey = REPLACE_WITH_CLIENT_PRIVATE_KEY
Address = 100.64.0.2/32
ListenPort = 51830

[Peer]
PublicKey = REPLACE_WITH_CONNECTOR_PUBLIC_KEY
AllowedIPs = 100.64.0.1/32
Endpoint = 127.0.0.1:51831
PersistentKeepalive = 25
